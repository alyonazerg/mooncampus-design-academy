];
const storeKey='mooncampus-academy-v1';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{}}catch{state={}}state.checks||={};state.notes||={};let view='home',current=0;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch{}}function countAll(){let total=weeks.reduce((n,w)=>n+w.resources.length+w.tasks.length,0);let done=Object.values(state.checks).filter(Boolean).length;return {total,done,pct:Math.round(100*done/total)}}function wcount(i){let w=weeks[i],keys=[...w.resources.map((_,j)=>`r${i}-${j}`),...w.tasks.map((_,j)=>`t${i}-${j}`)];return keys.filter(k=>state.checks[k]).length+'/'+keys.length}function navigation(){document.getElementById('nav').innerHTML=`<button class="${view==='home'?'active':''}" onclick="goHome()"><span class="num">⌂</span><span class="label">Обзор курса</span></button>`+weeks.map((w,i)=>`<button class="${view==='week'&&current===i?'active':''}" onclick="goWeek(${i})"><span class="num">${i+1}</span><span class="label">${esc(w.title)}</span></button>`).join('')+`<button class="${view==='notes'?'active':''}" onclick="goNotes()"><span class="num">✎</span><span class="label">Мой дизайн-журнал</span></button>`}function goHome(){view='home';render();scrollTo(0,0)}function goWeek(i){current=i;view='week';render();scrollTo(0,0)}function goNotes(){view='notes';render();scrollTo(0,0)}function toggle(k,v){state.checks[k]=v;save();render(false)}function setNote(k,v){state.notes[k]=v;save();let el=document.getElementById('saveflag');if(el)el.textContent='Сохранено автоматически ✓'}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mooncampus-academy-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.checks||!v.notes)throw Error();state=v;save();render();alert('Прогресс импортирован')}catch{alert('Не удалось прочитать файл прогресса')}};r.readAsText(f)}function render(reset=true){navigation();let {total,done,pct}=countAll();if(view==='home'){app.innerHTML=`<div class="top"><span class="eyebrow">Твоя дизайн-лаборатория</span><span class="pill">✦ UX · UI · LXD · Product</span></div><section class="hero"><h1>Design with intention.<br>Build for learning. ☾</h1><p class="lead">8-недельный практический курс по UX/UI на примере MoonCampus. Читай конкретные материалы, выполняй задания в своём проекте и постепенно собирай полноценную дизайн-систему.</p><button class="btn" onclick="goWeek(${Math.min(7,Math.floor(done/5))})">Продолжить обучение →</button></section><div class="stats"><div class="stat"><strong>${pct}%</strong><span>общий прогресс<div class="progress"><div class="bar" style="width:${pct}%"></div></div></span></div><div class="stat"><strong>${done}/${total}</strong><span>материалов и заданий</span></div><div class="stat"><strong>8 недель</strong><span>примерно 4–5 часов в неделю</span></div></div><div class="sectionhead"><h2>Твой маршрут</h2><span class="small">Выбери неделю</span></div><div class="weeks">${weeks.map((w,i)=>`<button class="weekcard" onclick="goWeek(${i})"><small>НЕДЕЛЯ ${String(i+1).padStart(2,'0')}</small><strong>${esc(w.title)}</strong><span>${wcount(i)} выполнено →</span></button>`).join('')}</div><div class="twocol block"><div class="panel"><h3>Как проходить курс</h3><p class="lead" style="font-size:14px">Каждую неделю: изучи материалы, выполни практические задания непосредственно на MoonCampus, ответь на вопросы самопроверки и сохрани выводы в дизайн-журнал. Отмечай чекбоксы по мере выполнения.</p><div class="milestone"><b>Правило курса:</b> сначала пользовательская задача → затем UX-решение → затем визуальный макет → только потом код.</div></div><div class="panel"><h3>Твои данные</h3><p class="small">Прогресс хранится локально в браузере. Для переноса на другое устройство экспортируй файл и импортируй его там. В приватном режиме браузера данные могут не сохраниться.</p><div class="toolbox"><button class="btn secondary" onclick="exportData()">↓ Экспорт прогресса</button><label class="btn ghost" style="cursor:pointer">↑ Импорт <input type="file" accept=".json" class="hide" onchange="importData(event)"></label></div></div></div><div class="footnote">MoonCampus Design Academy · Самостоятельная программа, составленная для твоего проекта. Внешние ресурсы принадлежат их авторам; часть книг платная, но все практические задания здесь бесплатны.</div>`}
else if(view==='week'){let w=weeks[current];app.innerHTML=`<button class="back" onclick="goHome()">← Все недели</button><div class="top"><span class="eyebrow">Неделя ${String(current+1).padStart(2,'0')} / 08</span><span class="pill">${wcount(current)} выполнено</span></div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.short)}. <b>Фокус:</b> ${esc(w.focus)}.</p><div class="twocol"><div><section class="block"><div class="blocktitle">01 / Что прочитать и посмотреть</div>${w.resources.map((r,j)=>`<div class="resource"><input aria-label="Изучено: ${esc(r[1])}" class="check" type="checkbox" ${state.checks[`r${current}-${j}`]?'checked':''} onchange="toggle('r${current}-${j}',this.checked)"><div style="flex:1"><a href="${r[2]}" target="_blank" rel="noopener noreferrer">${esc(r[1])} ↗</a><p>${esc(r[3])}</p></div><span class="tag">${esc(r[0])}</span></div>`).join('')}</section><section class="block"><div class="blocktitle">02 / Практика на MoonCampus</div>${w.tasks.map((t,j)=>`<div class="task"><div class="tasktop"><input class="check" type="checkbox" aria-label="Выполнено: ${esc(t[0])}" ${state.checks[`t${current}-${j}`]?'checked':''} onchange="toggle('t${current}-${j}',this.checked)"><div><h4>${esc(t[0])}</h4><span class="small">⏱ ${esc(t[1])}</span></div></div><ol>${t[2].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="meta">Результат: ${esc(t[3])}</div></div>`).join('')}</section></div><aside><div class="block"><div class="blocktitle">03 / Самопроверка</div><div class="hint">${w.questions.map((q,i)=>`<p><b>${i+1}.</b> ${esc(q)}</p>`).join('')}</div></div><div class="block"><div class="blocktitle">Итог недели</div><div class="panel"><h3>${esc(w.deliverable)}</h3><p class="small">Это конкретный артефакт, который пригодится для дальнейшего развития MoonCampus.</p></div></div><div class="block"><div class="blocktitle">04 / Дизайн-журнал</div><p class="small">Запиши, что обнаружила, какие решения приняла и что стоит протестировать.</p><textarea aria-label="Заметки недели" placeholder="Мои наблюдения, идеи, ссылки на макеты..." oninput="setNote('week${current}',this.value)">${esc(state.notes['week'+current]||'')}</textarea><div id="saveflag" class="small">Сохраняется автоматически</div></div></aside></div><div class="weeknav"><button class="btn secondary" ${current===0?'disabled':''} onclick="goWeek(${current-1})">← Предыдущая</button><button class="btn" ${current===7?'disabled':''} onclick="goWeek(${current+1})">Следующая неделя →</button></div>`}
else{app.innerHTML=`<button class="back" onclick="goHome()">← Обзор курса</button><span class="eyebrow">Рефлексия и решения</span><h1>Мой дизайн-журнал</h1><p class="lead">Место для продуктовых гипотез, выводов из исследований, решений и ссылок на Figma. Всё сохраняется в этом браузере.</p><div class="blocktitle">Глобальные заметки</div><textarea style="min-height:240px" placeholder="Дизайн-принципы MoonCampus, общие идеи, важные ссылки..." oninput="setNote('global',this.value)">${esc(state.notes.global||'')}</textarea><div id="saveflag" class="small">Сохраняется автоматически</div><div class="sectionhead"><h2>Заметки по неделям</h2></div>${weeks.map((w,i)=>`<div class="task"><div class="top"><strong>${i+1}. ${esc(w.title)}</strong><button class="btn secondary" onclick="goWeek(${i})">Открыть →</button></div><p class="small">${esc((state.notes['week'+i]||'').slice(0,300))||'Пока нет заметок'}</p></div>`).join('')}<div class="toolbox"><button class="btn" onclick="exportData()">Экспортировать прогресс и заметки</button></div>`}}
render();
</script></body></html>

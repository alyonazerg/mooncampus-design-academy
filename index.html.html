<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MoonCampus Design Academy — курс UX/UI</title><style>
:root{--bg:#f7f7f3;--paper:#fff;--ink:#26392f;--muted:#65796e;--sage:#427761;--line:#dce6dd;--mint:#e8f3eb;--gold:#c58a35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#2d7057}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh}.sidebar{padding:27px 17px;background:#eaf0e9;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}.brand{font:28px Georgia,serif;margin:0}.sub{font-size:11px;letter-spacing:2px;color:var(--sage);text-transform:uppercase;margin:4px 0 28px}.nav{width:100%;text-align:left;border:0;border-radius:12px;background:transparent;padding:11px;color:var(--ink);margin:3px 0}.nav.active{background:#fff;box-shadow:0 2px 12px #203c2812}.nav small{display:block;color:var(--muted);font-size:11px}.main{max-width:1150px;padding:38px 48px 90px;margin:auto;width:100%}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;line-height:1.2}h1{font-size:clamp(34px,5vw,55px);margin:6px 0 15px}h2{font-size:29px;margin:26px 0 12px}h3{font-size:21px;margin:0 0 9px}.muted{color:var(--muted)}.eyebrow{letter-spacing:2px;text-transform:uppercase;color:var(--sage);font-size:11px;font-weight:700}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat strong{font:30px Georgia,serif;display:block}.stat span{font-size:12px;color:var(--muted)}.bar{height:10px;background:#e2e9e1;border-radius:100px;overflow:hidden}.fill{height:100%;background:var(--sage);transition:width .3s}.resource{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding:17px 0}.resource:first-of-type{border-top:0}.tag{display:inline-block;background:var(--mint);padding:3px 8px;border-radius:6px;font-size:11px;color:#32614d;margin-right:7px}.small{font-size:13px}.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #edf0ed;cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--sage);margin-top:3px;flex-shrink:0}.check.done .ct{text-decoration:line-through;color:#829087}.button{border:1px solid #b6cbbd;border-radius:10px;background:#fff;color:var(--ink);padding:10px 14px;display:inline-block;text-decoration:none;font-size:13px}.button.primary{background:var(--sage);border-color:var(--sage);color:#fff}.button:hover,.nav:hover{filter:brightness(.97)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.badge.locked{opacity:.4}.badge .emoji{font-size:28px;display:block}.callout{background:#eef5ef;border-left:4px solid var(--sage);border-radius:10px;padding:15px;margin:16px 0}.task{padding:14px;border-radius:12px;background:#f8faf8;margin:9px 0}.task strong{color:#345a47}.section{margin-top:28px}textarea{width:100%;min-height:125px;border:1px solid #cbd8cf;border-radius:12px;padding:14px;background:#fff;resize:vertical}input[type=file]{max-width:100%}.foot{font-size:12px;color:var(--muted);margin-top:30px}.hide{display:none}.mini{font-size:12px;color:var(--muted)}.pill{border-radius:20px;background:#f4e9d6;color:#795522;padding:5px 10px;font-size:12px}.score{font-size:32px;font-family:Georgia,serif}@media(max-width:850px){.layout{display:block}.sidebar{position:static;height:auto;padding:18px}.sidebar .navlist{display:flex;overflow:auto;gap:8px}.nav{min-width:165px}.main{padding:24px 18px 70px}.grid{grid-template-columns:1fr 1fr}.resource{grid-template-columns:1fr}.card{padding:17px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">MoonCampus ✦</div><div class="sub">Design Academy</div><button class="nav" id="homeNav" onclick="go(0)">⌂ Обзор и достижения</button><div class="navlist" id="nav"></div><p class="foot">UX · UI · LXD · Gamification<br>Учишься — улучшаешь MoonCampus.<br>Прогресс сохраняется в этом браузере.</p></aside><main class="main" id="app"></main></div><script>
const WEEKS=[{"id": 1, "title": "UX-аудит MoonCampus", "desc": "Научиться видеть проблемы интерфейса до редизайна.", "resources": [{"type": "Статья", "title": "10 Usability Heuristics — NN/g", "how": "Прочитай эвристики 1, 3, 5, 6, 7 и 9; выпиши по примеру из MoonCampus.", "url": "https://www.nngroup.com/articles/ten-usability-heuristics/", "minutes": 20}, {"type": "Статья", "title": "How to Conduct a Heuristic Evaluation", "how": "Изучи этапы оценки; составь таблицу: экран → проблема → эвристика → серьёзность.", "url": "https://www.nngroup.com/articles/how-to-conduct-a-heuristic-evaluation/", "minutes": 15}, {"type": "Книга", "title": "Steve Krug — Don’t Make Me Think", "how": "Главы 1–3: как люди сканируют страницы; главы 6–7: навигация и главная страница. Номера глав могут отличаться по изданию.", "url": "https://www.sensible.com/dont-make-me-think/", "minutes": 35}], "tasks": ["Пройди путь студента: открыть ДЗ → понять требования → отправить → увидеть статус.", "Пройди путь преподавателя: найти новую работу → проверить → вернуть на доработку.", "Зафиксируй 10 проблем с влиянием на задачу и скриншотами."], "checks": ["Для каждой проблемы указана конкретная эвристика", "Есть как минимум 3 критические проблемы", "Приоритет основан на частоте и последствиях"]}, {"id": 2, "title": "Исследование пользователей", "desc": "Отделить собственные предположения от реальных потребностей.", "resources": [{"type": "Статья", "title": "User Interviews — NN/g", "how": "Изучи, как спрашивать о прошлом поведении, а не о гипотетических предпочтениях.", "url": "https://www.nngroup.com/articles/user-interviews/", "minutes": 20}, {"type": "Статья", "title": "Empathy Mapping: The First Step in Design Thinking", "how": "Сравни «говорит», «делает», «думает», «чувствует»; не выдавай предположения за факты.", "url": "https://www.nngroup.com/articles/empathy-mapping/", "minutes": 15}, {"type": "Статья", "title": "Journey Mapping 101", "how": "Обрати внимание на шаги, точки контакта и эмоциональные провалы.", "url": "https://www.nngroup.com/articles/journey-mapping-101/", "minutes": 15}], "tasks": ["Напиши 6 нейтральных вопросов для преподавателя и 6 для студента.", "Проведи хотя бы 2 коротких интервью и запиши дословные цитаты.", "Собери journey map: получение задания → выполнение → сдача → фидбек → исправление."], "checks": ["Вопросы не подсказывают желаемый ответ", "Факты отделены от гипотез", "Есть 3 проверяемых UX-гипотезы"]}, {"id": 3, "title": "Информационная архитектура", "desc": "Упростить навигацию и ключевые сценарии.", "resources": [{"type": "Статья", "title": "Information Architecture — NN/g", "how": "Разберись, как структура и названия разделов влияют на поиск.", "url": "https://www.nngroup.com/articles/information-architecture-sitemaps/", "minutes": 20}, {"type": "Статья", "title": "Progressive Disclosure — NN/g", "how": "Посмотри, как скрывать второстепенную сложность, не пряча нужное.", "url": "https://www.nngroup.com/articles/progressive-disclosure/", "minutes": 15}, {"type": "Справочник", "title": "Laws of UX — Hick’s Law", "how": "Прочитай закон Хика и ограничения его применения.", "url": "https://lawsofux.com/hicks-law/", "minutes": 10}], "tasks": ["Нарисуй карту разделов: курсы, группы, задания, проверка, прогресс, словарь.", "Построй user flow возврата ДЗ на доработку, включая ошибки и отмену.", "Предложи новую навигацию и протестируй поиск задания на другом человеке."], "checks": ["Нет тупиковых сценариев", "Названия разделов понятны без объяснения", "Есть путь назад и подтверждение опасных действий"]}, {"id": 4, "title": "Figma: базовые навыки", "desc": "Создавать настоящие редактируемые макеты.", "resources": [{"type": "Урок + видео", "title": "Introduction to Figma Design", "how": "Пройди разделы Using frames, Using shapes, Typography basics.", "url": "https://www.figma.com/resource-library/k-12-design-basics/", "minutes": 40}, {"type": "Урок + видео", "title": "Auto layout fundamentals", "how": "Повтори пример адаптивной кнопки; Shift+A; проверь padding и gap.", "url": "https://help.figma.com/hc/en-us/articles/31351261703063-FD4B-Auto-layout-fundamentals", "minutes": 25}, {"type": "Справочник", "title": "Guide to auto layout in Figma", "how": "Прочитай про flow, spacing, padding и resizing.", "url": "https://help.figma.com/hc/en-us/articles/360040451373-Guide-to-auto-layout-in-Figma", "minutes": 20}], "tasks": ["Создай Figma-файл MoonCampus Academy / Practice.", "Собери кнопку с Auto Layout и 3 длинами текста.", "Перерисуй карточку задания из MoonCampus для desktop и mobile."], "checks": ["Кнопка меняет ширину без ручной правки", "Используются frames и auto layout", "Мобильный макет не имеет горизонтальной прокрутки"]}, {"id": 5, "title": "Визуальная система и компоненты", "desc": "Привести интерфейс к единому языку.", "resources": [{"type": "Урок + видео", "title": "Components fundamentals — Figma", "how": "Изучи main component и instance, создай варианты кнопок.", "url": "https://help.figma.com/hc/en-us/articles/39635555294743-Components-collection-Components-fundamentals", "minutes": 25}, {"type": "Справочник", "title": "Material Design 3 — Components", "how": "Посмотри button, text field, chip, snackbar, dialog и их состояния.", "url": "https://m3.material.io/components", "minutes": 25}, {"type": "Справочник", "title": "W3C — Contrast (Minimum)", "how": "Изучи требования контраста и проверь свои цвета.", "url": "https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html", "minutes": 15}], "tasks": ["Создай токены: цвета, типографика, отступы, радиусы.", "Собери компоненты: Button, Status chip, Assignment card, Text field.", "Проверь контраст текста и состояние focus."], "checks": ["Не только цвет сообщает статус", "Есть состояния disabled, error, loading", "Компоненты переиспользуются как instances"]}, {"id": 6, "title": "Сложные экраны и UX-writing", "desc": "Ускорить проверку большого количества работ.", "resources": [{"type": "Статья", "title": "Error-Message Guidelines — NN/g", "how": "Обрати внимание: что произошло, почему, как исправить.", "url": "https://www.nngroup.com/articles/error-message-guidelines/", "minutes": 15}, {"type": "Справочник", "title": "Material Design — Data tables", "how": "Изучи сортировку, плотность данных, действия над строками.", "url": "https://m3.material.io/components/data-tables/overview", "minutes": 20}, {"type": "Справочник", "title": "W3C — Forms Tutorial", "how": "Изучи labels, instructions, validation и доступность.", "url": "https://www.w3.org/WAI/tutorials/forms/", "minutes": 25}], "tasks": ["Спроектируй очередь проверки: новые, на доработке, проверенные.", "Добавь массовые действия, фильтры и подтверждение оценивания.", "Напиши тексты для 5 ошибок, 3 пустых состояний и 3 уведомлений."], "checks": ["Видно количество работ по статусам", "Ошибки предлагают следующий шаг", "Массовое действие можно отменить или подтвердить"]}, {"id": 7, "title": "Learning Experience Design", "desc": "Сделать обратную связь педагогически полезной.", "resources": [{"type": "Статья", "title": "Feedback — Education Endowment Foundation", "how": "Изучи принципы эффективной обратной связи и подумай, что из них применимо к платформе.", "url": "https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/feedback", "minutes": 25}, {"type": "Справочник", "title": "W3C — Understanding Focus Visible", "how": "Посмотри, почему клавиатурный фокус важен в обучающих формах.", "url": "https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html", "minutes": 15}, {"type": "Статья", "title": "Recognition Rather than Recall — NN/g", "how": "Посмотри шестую эвристику в контексте учебных действий.", "url": "https://www.nngroup.com/articles/recognition-and-recall/", "minutes": 15}], "tasks": ["Спроектируй карточку фидбека: что получилось → что улучшить → конкретное действие.", "Добавь student-facing экран: прогресс, ближайшее действие, история доработок.", "Продумай, как подсказки не превращаются в готовые ответы."], "checks": ["Фидбек можно применить при пересдаче", "Прогресс не сводится только к баллам", "Студент понимает следующий шаг"]}, {"id": 8, "title": "Геймификация без манипуляций", "desc": "Проектировать мотивацию, не подменяя обучение очками.", "resources": [{"type": "Статья", "title": "Gamification in Education — Interaction Design Foundation", "how": "Разбери различие игровых элементов и реальных учебных целей.", "url": "https://www.interaction-design.org/literature/topics/gamification", "minutes": 25}, {"type": "Справочник", "title": "Self-Determination Theory — overview", "how": "Изучи autonomy, competence, relatedness как основу внутренней мотивации.", "url": "https://selfdeterminationtheory.org/theory/", "minutes": 20}, {"type": "Статья", "title": "Laws of UX — Goal-Gradient Effect", "how": "Изучи эффект приближения к цели и ограничения прогресс-баров.", "url": "https://lawsofux.com/goal-gradient-effect/", "minutes": 10}], "tasks": ["Спроектируй 3 механики: mastery badge, личный прогресс и командную цель.", "Для каждой запиши: желаемое учебное поведение → риск → как измерить пользу.", "Создай экран «Мой рост»: навыки, попытки, улучшения, следующий шаг."], "checks": ["Нет наказания за пропуск дня", "Баллы не поощряют бессмысленное накликивание", "Есть возможность отключить сравнение с другими"]}, {"id": 9, "title": "Тестирование и handoff", "desc": "Довести макеты до работающего интерфейса.", "resources": [{"type": "Статья", "title": "Usability Testing 101 — NN/g", "how": "Изучи задачи, наблюдение, протокол и фиксацию ошибок.", "url": "https://www.nngroup.com/articles/usability-testing-101/", "minutes": 25}, {"type": "Справочник", "title": "Figma — Prototyping", "how": "Изучи интерактивные переходы и подготовку прототипа.", "url": "https://help.figma.com/hc/en-us/categories/360002051613-Prototyping", "minutes": 20}, {"type": "Справочник", "title": "WCAG 2.2 Quick Reference", "how": "Проверь клавиатуру, фокус, контраст и сообщения об ошибках.", "url": "https://www.w3.org/WAI/WCAG22/quickref/", "minutes": 20}], "tasks": ["Протестируй 3 задачи на 3 пользователях; фиксируй успех и затруднения.", "Подготовь handoff: макеты, состояния, тексты, acceptance criteria.", "Создай backlog UX-улучшений с impact/effort."], "checks": ["Есть измеримые критерии приёмки", "Отдельно отмечены реальные тесты и предположения", "Описаны empty/loading/error/success states"]}];
const KEY='moonacademy-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state.done=state.done||{};state.notes=state.notes||{};state.last=state.last||0;let page=state.last;const save=()=>{state.last=page;localStorage.setItem(KEY,JSON.stringify(state))};const k=(w,kind,i)=>`${w}-${kind}-${i}`;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const allKeys=()=>WEEKS.flatMap(w=>[...w.resources.map((_,i)=>k(w.id,'r',i)),...w.tasks.map((_,i)=>k(w.id,'t',i)),...w.checks.map((_,i)=>k(w.id,'c',i))]);const count=()=>allKeys().filter(x=>state.done[x]).length;const total=()=>allKeys().length;const pct=()=>Math.round(count()/total()*100);const xp=()=>WEEKS.reduce((a,w)=>a+w.resources.reduce((s,_,i)=>s+(state.done[k(w.id,'r',i)]?10:0),0)+w.tasks.reduce((s,_,i)=>s+(state.done[k(w.id,'t',i)]?30:0),0)+w.checks.reduce((s,_,i)=>s+(state.done[k(w.id,'c',i)]?15:0),0),0);const level=()=>1+Math.floor(xp()/180);const weekPct=w=>Math.round([...w.resources.map((_,i)=>k(w.id,'r',i)),...w.tasks.map((_,i)=>k(w.id,'t',i)),...w.checks.map((_,i)=>k(w.id,'c',i))].filter(x=>state.done[x]).length/(w.resources.length+w.tasks.length+w.checks.length)*100);function toggle(key){state.done[key]=!state.done[key];save();render()}function go(p){page=p;save();render();window.scrollTo(0,0)}function checkbox(key,body){return `<label class="check ${state.done[key]?'done':''}"><input type="checkbox" ${state.done[key]?'checked':''} onchange="toggle('${key}')"><span class="ct">${body}</span></label>`}function nav(){document.getElementById('homeNav').classList.toggle('active',page===0);document.getElementById('nav').innerHTML=WEEKS.map(w=>`<button class="nav ${page===w.id?'active':''}" onclick="go(${w.id})">${String(w.id).padStart(2,'0')} · ${esc(w.title)}<small>${weekPct(w)}% завершено</small></button>`).join('')}
const achievements=[['🌱','Первый шаг',count()>=1],['📚','Исследователь',WEEKS.slice(0,3).every(w=>weekPct(w)===100)],['🎨','UI-архитектор',WEEKS.slice(3,6).every(w=>weekPct(w)===100)],['🧠','LXD-мастер',weekPct(WEEKS[6])===100],['🎲','Этичный геймдизайнер',weekPct(WEEKS[7])===100],['🏆','MoonCampus Designer',pct()===100]];
function overview(){return `<div class="eyebrow">Персональная образовательная траектория</div><h1>Дизайн, который помогает учиться.</h1><p class="muted">9 модулей · конкретные статьи, видеоуроки, задания на MoonCampus и критерии качества. Отмечай только действительно изученное и сделанное.</p><div class="grid"><div class="card stat"><strong>${pct()}%</strong><span>общий прогресс</span></div><div class="card stat"><strong>${xp()} XP</strong><span>опыт за выполненные шаги</span></div><div class="card stat"><strong>${level()}</strong><span>уровень дизайнера</span></div></div><div class="card"><div class="row" style="justify-content:space-between"><h3>Твоя траектория</h3><span class="pill">${count()} / ${total()} шагов</span></div><div class="bar"><div class="fill" style="width:${pct()}%"></div></div><p class="mini">Ресурс +10 XP · практика +30 XP · проверка качества +15 XP. Нет штрафов за перерывы и искусственных дедлайнов.</p></div><h2>Модули</h2><div class="grid">${WEEKS.map(w=>`<div class="card"><span class="eyebrow">Модуль ${w.id}</span><h3>${esc(w.title)}</h3><p class="small muted">${esc(w.desc)}</p><div class="bar"><div class="fill" style="width:${weekPct(w)}%"></div></div><p class="mini">${weekPct(w)}% готово</p><button class="button" onclick="go(${w.id})">${weekPct(w)?'Продолжить':'Начать'} →</button></div>`).join('')}</div><h2>Достижения</h2><div class="grid">${achievements.map(a=>`<div class="badge ${a[2]?'':'locked'}"><span class="emoji">${a[0]}</span><strong>${a[1]}</strong><div class="mini">${a[2]?'Открыто':'Пока закрыто'}</div></div>`).join('')}</div><div class="card"><h3>Резервная копия прогресса</h3><p class="small muted">Данные сохраняются локально. Экспортируй JSON, чтобы перенести на другой браузер или устройство.</p><div class="row"><button class="button" onclick="exportData()">↓ Экспортировать</button><label class="button">↑ Импортировать <input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label><button class="button" onclick="if(confirm('Сбросить весь прогресс?')){state={done:{},notes:{},last:0};go(0)}">Сбросить</button></div></div>`}
function module(w){let mins=w.resources.reduce((s,r)=>s+r.minutes,0);return `<div class="eyebrow">Модуль ${w.id} из ${WEEKS.length} · ~${mins} минут материалов</div><h1>${esc(w.title)}</h1><p class="muted">${esc(w.desc)}</p><div class="card"><div class="row" style="justify-content:space-between"><strong>Прогресс модуля</strong><span class="pill">${weekPct(w)}%</span></div><div class="bar" style="margin-top:12px"><div class="fill" style="width:${weekPct(w)}%"></div></div></div><h2>01 · Изучи конкретные материалы</h2><p class="muted small">Сначала открой материал, выполни инструкцию «На что смотреть», затем поставь галочку. Материалы на английском, но задания и пояснения — на русском.</p><div class="card">${w.resources.map((r,i)=>`<div class="resource"><div><span class="tag">${esc(r.type)}</span><span class="mini">~${r.minutes} мин</span><h3 style="margin:9px 0">${esc(r.title)}</h3><p class="small"><strong>На что смотреть:</strong> ${esc(r.how)}</p>${checkbox(k(w.id,'r',i),'Изучено и законспектировано (+10 XP)')}</div><div><a class="button primary" target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Открыть ↗</a></div></div>`).join('')}</div><h2>02 · Примени к MoonCampus</h2><p class="muted small">Практика важнее чтения. Делай задания на реальном продукте; не отмечай шаг, пока нет результата.</p><div class="card">${w.tasks.map((t,i)=>`<div class="task"><strong>Миссия ${i+1}</strong>${checkbox(k(w.id,'t',i),esc(t)+' <span class="mini">(+30 XP)</span>')}</div>`).join('')}</div><h2>03 · Проверь качество</h2><div class="card">${w.checks.map((c,i)=>checkbox(k(w.id,'c',i),esc(c)+' <span class="mini">(+15 XP)</span>')).join('')}</div><h2>04 · Рефлексия</h2><div class="callout">Что я узнала? Что изменила в MoonCampus? Как пойму, что решение действительно помогает пользователю?</div><textarea placeholder="Твой конспект, ссылки на макеты, выводы и идеи…" oninput="note(${w.id},this.value)">${esc(state.notes[w.id]||'')}</textarea><p class="mini">Черновик сохраняется автоматически в этом браузере.</p><div class="row" style="margin-top:25px"><button class="button" onclick="go(${Math.max(0,w.id-1)})">← Назад</button>${w.id<WEEKS.length?`<button class="button primary" onclick="go(${w.id+1})">Следующий модуль →</button>`:`<button class="button primary" onclick="go(0)">К достижениям →</button>`}</div>`}
function note(id,value){state.notes[id]=value;save()}function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mooncampus-academy-progress.json';a.click();URL.revokeObjectURL(url)}function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.state||!data.state.done)throw Error('Неверный формат');if(confirm('Заменить текущий прогресс импортированным?')){state=data.state;go(0)}}catch(err){alert('Не удалось импортировать: '+err.message)}};reader.readAsText(f)}function render(){nav();document.getElementById('app').innerHTML=page===0?overview():module(WEEKS[page-1])}render();
</script><style>
#lab-launch{position:fixed;right:22px;bottom:22px;z-index:99;border:0;border-radius:50px;background:#345a4a;color:white;padding:15px 21px;box-shadow:0 10px 30px #345a4a44;font-weight:700;cursor:pointer}#lab-overlay{position:fixed;inset:0;background:#182a2399;z-index:100;display:none;overflow:auto;padding:20px}#lab-overlay.show{display:block}.lab-shell{max-width:1100px;margin:auto;background:#f7f6f2;border-radius:22px;padding:28px;min-height:90vh;color:#27332e}.lab-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.lab-card{background:white;border:1px solid #e4e8e0;border-radius:16px;padding:20px}.lab-field{display:block;width:100%;border:1px solid #cbd7ce;border-radius:10px;padding:11px;margin:8px 0 13px;background:white;color:#27332e}.lab-shell textarea{min-height:110px}.lab-button{border:0;border-radius:10px;background:#345a4a;color:white;padding:11px 16px;cursor:pointer}.lab-muted{color:#66736b;font-size:13px;line-height:1.5}.lab-track{height:10px;background:#e4e8e0;border-radius:12px;overflow:hidden}.lab-track div{height:100%;background:#658a77}.lab-list label{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}.lab-list input{accent-color:#345a4a}.lab-shell h2{font-size:27px;margin-top:24px}.lab-shell h3{font-size:20px}.lab-entry{border-top:1px solid #e4e8e0;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.lab-chip{display:inline-block;background:#e9f1e9;border-radius:30px;padding:5px 9px;font-size:12px;margin:4px}.lab-link{color:#345a4a;text-decoration:underline}@media(max-width:600px){.lab-shell{padding:18px}#lab-overlay{padding:5px}}
</style>
<button id="lab-launch" onclick="openDesignLab()">✦ Design Lab</button>
<div id="lab-overlay" role="dialog" aria-modal="true" aria-label="MoonCampus Design Lab"><div class="lab-shell"><div class="lab-head"><div><div class="lab-muted">MOONCAMPUS DESIGN ACADEMY</div><h1 style="margin:6px 0">Design Lab & Portfolio</h1><p class="lab-muted">Документируй процесс, а не только красивые экраны. Всё сохраняется локально; регулярно экспортируй копию.</p></div><button class="lab-button" onclick="closeDesignLab()">✕ Закрыть</button></div><div id="lab-body"></div></div></div>
<script>
const LAB_KEY='mooncampus_design_lab_v1';const LAB_PROJECTS=[['UX','Проверка домашних заданий','Исследование → сценарии → usability test'],['UI','MoonCampus Design System','Типографика → компоненты → адаптивность'],['LXD','Обратная связь и повторная сдача','Цели обучения → практика → feedback'],['Product','Преподавательский дашборд','Приоритеты → прототип → метрики'],['Gamification','Мотивация без давления','SDT → механики → этические проверки']];
const LAB_CRITERIA=[['problem','Проблема и контекст: кому и почему трудно'],['role','Моя роль, границы ответственности и вклад ИИ'],['research','Исследование: метод, участники, наблюдения'],['flows','User flows / информационная архитектура'],['alternatives','Альтернативы и обоснование решений'],['screens','Макеты, компоненты, состояния и доступность'],['test','Тестирование с реальными пользователями'],['iteration','Итерации: что изменилось после проверки'],['impact','Результаты и метрики (или честно обозначенные ограничения)'],['reflection','Рефлексия и следующие шаги']];
let labState;try{labState=JSON.parse(localStorage.getItem(LAB_KEY))||{}}catch(e){labState={}};labState.projects ||= {};labState.entries ||= [];
function labSave(){localStorage.setItem(LAB_KEY,JSON.stringify(labState))}
function labEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDesignLab(){document.getElementById('lab-overlay').classList.add('show');labRender()}
function closeDesignLab(){document.getElementById('lab-overlay').classList.remove('show')}
function labProject(i){return labState.projects[i] ||= {checks:{},notes:'',figma:'',evidence:'',ai:''}}
function labPct(i){const p=labProject(i);return Math.round(100*LAB_CRITERIA.filter(([k])=>p.checks[k]).length/LAB_CRITERIA.length)}
function labUpdate(i,field,value){labProject(i)[field]=value;labSave()}
function labCheck(i,k,v){labProject(i).checks[k]=v;labSave();labRender()}
function labRender(){const n=LAB_PROJECTS.length;let total=Math.round(LAB_PROJECTS.reduce((a,_,i)=>a+labPct(i),0)/n);document.getElementById('lab-body').innerHTML=`<div class="lab-card" style="margin:20px 0"><strong>Portfolio Readiness · ${total}%</strong><div class="lab-track" style="margin:10px 0"><div style="width:${total}%"></div></div><p class="lab-muted">Это полнота документирования, а не оценка профессионального мастерства. Отмечай пункты только при наличии доказательств.</p><button class="lab-button" onclick="labExport()">↓ Экспорт Design Lab (JSON)</button> <label class="lab-button" style="display:inline-block;cursor:pointer">↑ Импорт <input type="file" accept="application/json" hidden onchange="labImport(event)"></label></div><h2>Пять портфолио-кейсов из одного продукта</h2><div class="lab-grid">${LAB_PROJECTS.map((p,i)=>`<div class="lab-card"><span class="lab-chip">${p[0]}</span><h3>${p[1]}</h3><p class="lab-muted">${p[2]}</p><div class="lab-track"><div style="width:${labPct(i)}%"></div></div><p class="lab-muted">${labPct(i)}% доказательств</p><button class="lab-button" onclick="labOpenProject(${i})">Открыть кейс →</button></div>`).join('')}</div><h2>Журнал дизайнерских решений</h2><div class="lab-card"><p class="lab-muted">Формат: проблема → гипотеза → решение → проверка → результат. Не записывай персональные данные студентов.</p><input class="lab-field" id="lab-entry-title" placeholder="Например: студенты не замечают статус Revision needed"><textarea class="lab-field" id="lab-entry-body" placeholder="Что наблюдала? Какие есть альтернативы? Как проверю? Что получилось?"></textarea><button class="lab-button" onclick="labAddEntry()">+ Сохранить запись</button>${labState.entries.map((e,i)=>`<div class="lab-entry"><strong>${labEsc(e.title)}</strong> <span class="lab-muted">${labEsc(e.date)}</span><p>${labEsc(e.body)}</p><button onclick="labDeleteEntry(${i})">Удалить</button></div>`).join('')}</div><h2>Как оформить итоговый кейс</h2><div class="lab-card"><p>Контекст → проблема → моя роль → исследования → ограничения → гипотезы → варианты → прототип → тесты → итерации → результаты → выводы.</p><p class="lab-muted">Если нет реальных данных, пиши «гипотеза» или «планируемая метрика», а не придумывай проценты. Отдельно указывай, что сделала сама, а что было сгенерировано ИИ.</p><a class="lab-link" target="_blank" rel="noopener" href="https://www.nngroup.com/articles/ux-portfolio/">NN/g: UX portfolio guidance ↗</a></div>`}
function labOpenProject(i){let p=labProject(i),meta=LAB_PROJECTS[i];document.getElementById('lab-body').innerHTML=`<button class="lab-button" onclick="labRender()">← Все кейсы</button><h2>${labEsc(meta[1])}</h2><p class="lab-muted">${labEsc(meta[2])}</p><div class="lab-card"><strong>Portfolio Readiness: ${labPct(i)}%</strong><div class="lab-track" style="margin-top:10px"><div style="width:${labPct(i)}%"></div></div></div><div class="lab-grid" style="margin-top:15px"><div class="lab-card"><h3>Чеклист доказательств</h3><div class="lab-list">${LAB_CRITERIA.map(([k,label])=>`<label><input type="checkbox" ${p.checks[k]?'checked':''} onchange="labCheck(${i},'${k}',this.checked)">${labEsc(label)}</label>`).join('')}</div></div><div class="lab-card"><h3>Артефакты и авторство</h3><label>Figma / прототип / GitHub URL<input class="lab-field" value="${labEsc(p.figma)}" oninput="labUpdate(${i},'figma',this.value)" placeholder="https://..."></label><label>Ссылки на доказательства<textarea class="lab-field" oninput="labUpdate(${i},'evidence',this.value)" placeholder="Интервью, скриншоты, результаты тестов">${labEsc(p.evidence)}</textarea></label><label>Мой вклад и использование ИИ<textarea class="lab-field" oninput="labUpdate(${i},'ai',this.value)" placeholder="Что спроектировала я? Что сгенерировал ИИ? Что проверила и изменила?">${labEsc(p.ai)}</textarea></label></div></div><div class="lab-card" style="margin-top:15px"><h3>Черновик кейса</h3><textarea class="lab-field" style="min-height:230px" oninput="labUpdate(${i},'notes',this.value)" placeholder="Контекст, проблема, процесс, решения, тестирование, итерации, результаты...">${labEsc(p.notes)}</textarea><button class="lab-button" onclick="labCopyCase(${i})">Скопировать кейс как Markdown</button></div>`}
function labCopyCase(i){const p=labProject(i),m=LAB_PROJECTS[i];navigator.clipboard.writeText(`# ${m[1]}\n\n${p.notes}\n\n## Мой вклад и ИИ\n${p.ai}\n\n## Артефакты\n${p.figma}\n${p.evidence}`).then(()=>alert('Скопировано'))}
function labAddEntry(){const title=document.getElementById('lab-entry-title').value.trim(),body=document.getElementById('lab-entry-body').value.trim();if(!title||!body)return alert('Добавь название и описание');labState.entries.unshift({title,body,date:new Date().toLocaleDateString('ru-RU')});labSave();labRender()}
function labDeleteEntry(i){if(confirm('Удалить запись?')){labState.entries.splice(i,1);labSave();labRender()}}
function labExport(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,labState},null,2)],{type:'application/json'}));a.href=u;a.download='mooncampus-design-lab.json';a.click();URL.revokeObjectURL(u)}
function labImport(e){const f=e.target.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.labState||!d.labState.projects)throw Error('Неверный файл');if(confirm('Заменить текущий Design Lab?')){labState=d.labState;labState.entries ||= [];labSave();labRender()}}catch(err){alert(err.message)}})}
</script></body></html>
